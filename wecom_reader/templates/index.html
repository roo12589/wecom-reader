<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>企业微信聊天记录</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="会话列表">
    <header class="sidebar-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 11.2a8.3 8.3 0 0 1-8.4 8.2 8.9 8.9 0 0 1-3.5-.7L4 20l1.3-4a8 8 0 0 1-.8-3.6A8.3 8.3 0 0 1 12.9 3a8.2 8.2 0 0 1 7.6 8.2Z"></path>
          <path d="M9 10.5h.01M13 10.5h.01M17 10.5h.01"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1>聊天记录</h1>
        <p id="statusLine">正在连接数据…</p>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" title="刷新数据" aria-label="刷新数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 0 0-13.9-5.2L4 8"></path>
          <path d="M4 4v4h4"></path>
          <path d="M4 13a8 8 0 0 0 13.9 5.2L20 16"></path>
          <path d="M16 16h4v4"></path>
        </svg>
      </button>
    </header>

    <div class="sidebar-search">
      <div class="mode-switch" role="tablist" aria-label="搜索范围">
        <button id="modeSessions" class="mode-btn is-active" type="button" role="tab" aria-selected="true">会话</button>
        <button id="modeMessages" class="mode-btn" type="button" role="tab" aria-selected="false">消息</button>
      </div>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
        </span>
        <input id="searchInput" type="search" placeholder="搜索会话" autocomplete="off" aria-label="搜索会话">
        <button id="searchClear" class="search-clear" type="button" title="清除搜索" aria-label="清除搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>
      </div>
    </div>

    <nav id="filterTabs" class="filter-tabs" aria-label="会话类型">
      <button class="tab is-active" type="button" data-type="all">全部</button>
      <button class="tab" type="button" data-type="single">单聊</button>
      <button class="tab" type="button" data-type="group">群聊</button>
      <button class="tab" type="button" data-type="app">应用</button>
      <button class="tab" type="button" data-type="system">系统</button>
      <button class="tab" type="button" data-type="external">外部</button>
    </nav>

    <div id="sessionList" class="session-list" role="list"></div>

    <footer id="sessionFooter" class="sidebar-footer">
      <span id="sessionFooterText">正在加载会话…</span>
      <button id="loadMoreSessions" class="link-btn" type="button" hidden>加载更多</button>
    </footer>
  </aside>
  <div id="sidebarMask" class="sidebar-mask" hidden></div>

  <main id="main" class="main">
    <div id="emptyState" class="empty-state">
      <div class="empty-illustration" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M52 29.5c0 11.4-9.8 20.5-21.5 20.5-3 0-5.9-.6-8.5-1.7L9 52l3.8-10.1A19.6 19.6 0 0 1 9 29.5C9 18.1 18.8 9 30.5 9S52 18.1 52 29.5Z"></path>
          <path d="M23 28.5h.01M31 28.5h.01M39 28.5h.01"></path>
        </svg>
      </div>
      <p class="empty-title">选择左侧会话开始查看</p>
      <p class="empty-sub">支持按消息类型、日期筛选，也可搜索全部聊天记录</p>
    </div>

    <section id="chatView" class="chat-view" hidden aria-label="聊天记录">
      <header id="chatHeader" class="chat-header">
        <button id="sidebarToggle" class="icon-btn menu-btn" type="button" title="展开会话列表" aria-label="展开会话列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <div id="chatAvatar" class="avatar avatar-md"></div>
        <div class="chat-title">
          <h2 id="chatName">会话</h2>
          <p id="chatMeta"></p>
        </div>
        <div class="chat-actions">
          <button id="chatSearchBtn" class="icon-btn" type="button" title="在会话中搜索" aria-label="在会话中搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </button>
          <button id="chatInfoBtn" class="icon-btn" type="button" title="会话详情" aria-label="会话详情">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 11v5"></path>
              <circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <button id="latestBtn" class="text-btn latest-btn" type="button" hidden>回到最新</button>
        </div>
      </header>

      <div id="chatToolbar" class="chat-toolbar">
        <div id="typeChips" class="chips" aria-label="消息类型筛选">
          <button class="chip is-active" type="button" data-type="">全部</button>
          <button class="chip" type="button" data-type="text">文本</button>
          <button class="chip" type="button" data-type="image">图片</button>
          <button class="chip" type="button" data-type="file">文件</button>
          <button class="chip" type="button" data-type="video">视频</button>
          <button class="chip" type="button" data-type="voice">语音</button>
          <button class="chip" type="button" data-type="link">链接</button>
          <button class="chip" type="button" data-type="app">应用</button>
          <button class="chip" type="button" data-type="forward">转发</button>
          <button class="chip" type="button" data-type="quote">引用</button>
          <button class="chip" type="button" data-type="sticker">表情</button>
          <button class="chip" type="button" data-type="meeting">会议</button>
          <button class="chip" type="button" data-type="call">通话</button>
          <button class="chip" type="button" data-type="system">系统</button>
        </div>
        <div class="toolbar-row">
          <label class="select-wrap">
            <span>日期</span>
            <select id="dateSelect" aria-label="日期筛选">
              <option value="all">全部时间</option>
              <option value="today">今天</option>
              <option value="7">近 7 天</option>
              <option value="30">近 30 天</option>
              <option value="custom">自定义</option>
            </select>
          </label>
          <div id="customDate" class="custom-date" hidden>
            <input id="startDate" type="date" aria-label="开始日期">
            <span class="date-sep-tilde">至</span>
            <input id="endDate" type="date" aria-label="结束日期">
          </div>
          <button id="clearFilters" class="text-btn" type="button">清除筛选</button>
        </div>
        <div id="chatSearchBar" class="chat-search-bar" hidden>
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </span>
          <input id="chatSearchInput" type="search" placeholder="搜索当前会话的消息" autocomplete="off" aria-label="搜索当前会话的消息">
          <button id="chatSearchClose" class="text-btn" type="button">退出搜索</button>
        </div>
      </div>

      <div id="activeFilters" class="active-filters" hidden></div>
      <div id="chatSearchPanel" class="chat-search-panel" hidden></div>

      <div id="messageScroll" class="message-scroll">
        <div id="loadOlderSentinel" class="load-sentinel">
          <button id="loadOlderBtn" class="ghost-btn" type="button" hidden>加载更早消息</button>
          <span id="loadOlderStatus" class="sentinel-text"></span>
        </div>
        <div id="messageList" class="message-list"></div>
        <div id="loadNewerSentinel" class="load-sentinel-bottom"></div>
      </div>
    </section>

    <div id="searchPanel" class="search-panel" hidden></div>
  </main>

  <div id="detailDrawer" class="drawer" hidden>
    <div class="drawer-mask" data-close-drawer></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="会话详情">
      <header class="drawer-header">
        <h2>会话详情</h2>
        <button id="drawerClose" class="icon-btn" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>
      </header>
      <div id="drawerBody" class="drawer-body"></div>
    </aside>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightboxClose" class="lightbox-close icon-btn" type="button" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="m7 7 10 10M17 7 7 17"></path>
      </svg>
    </button>
    <button id="lightboxPrev" class="lightbox-nav lightbox-nav-prev" type="button" title="上一张" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m14.5 6-6 6 6 6"></path>
      </svg>
    </button>
    <div id="lightboxStage" class="lightbox-stage">
      <img id="lightboxImg" alt="图片预览">
    </div>
    <button id="lightboxNext" class="lightbox-nav lightbox-nav-next" type="button" title="下一张" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9.5 6 6 6-6 6"></path>
      </svg>
    </button>
    <div class="lightbox-toolbar">
      <button id="lightboxZoomOut" type="button" title="缩小" aria-label="缩小">−</button>
      <span id="lightboxPercent" class="lightbox-readout">100%</span>
      <button id="lightboxZoomIn" type="button" title="放大" aria-label="放大">＋</button>
      <button id="lightboxFit" type="button" title="适应窗口" aria-label="适应窗口">适应窗口</button>
      <button id="lightboxActual" type="button" title="原始大小" aria-label="原始大小">原始大小</button>
      <span id="lightboxCounter" class="lightbox-readout">1 / 1</span>
      <button id="lightboxLocate" type="button" title="定位到聊天位置" aria-label="定位到聊天位置">定位聊天</button>
      <a id="lightboxDownload" class="lightbox-download" href="#" download>下载原图</a>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="bootError" class="boot-error" hidden>
    <div class="boot-error-card">
      <div class="boot-error-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M12 3 2.8 19.5h18.4L12 3Z"></path>
          <path d="M12 9.5v4.5"></path>
          <circle cx="12" cy="17" r="1.1" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <h2>无法连接数据服务</h2>
      <p id="bootErrorText">请确认后端服务已启动后重试。</p>
      <button id="bootRetry" class="primary-btn" type="button">重新加载</button>
    </div>
  </div>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
